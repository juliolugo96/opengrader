[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opengrader"
version = "0.6.0"
description = "A local-first, CLI autograder"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "OpenGrader contributors" }]
dependencies = [
  "fastapi>=0.140,<1",
  "pypdf>=6.14,<7",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "stripe>=15.5,<16",
  "typer>=0.12,<1",
  "uvicorn>=0.51,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "mutmut>=3.6,<4",
  "pytest>=8,<10",
  "pytest-bdd>=8.1,<9",
]

[project.scripts]
opengrader = "opengrader.cli:app"
opengrader-api = "opengrader.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "unit: isolated domain tests",
  "integration: tests spanning multiple OpenGrader components",
  "e2e: tests exercising a complete user workflow",
]

[tool.mutmut]
source_paths = [
  "src/opengrader/worker.py",
  "src/opengrader/mvp4_contract.py",
  "src/opengrader/pdf_contract.py",
  "src/opengrader/billing_contract.py",
  "src/opengrader/academic.py",
]
pytest_add_cli_args_test_selection = ["tests/unit/"]
also_copy = [
  "pyproject.toml",
  "src/opengrader/__init__.py",
  "src/opengrader/api.py",
  "src/opengrader/api_models.py",
  "src/opengrader/academic.py",
  "src/opengrader/academic_repository.py",
  "src/opengrader/academic_service.py",
  "src/opengrader/billing.py",
  "src/opengrader/billing_contract.py",
  "src/opengrader/billing_repository.py",
  "src/opengrader/billing_service.py",
  "src/opengrader/cli.py",
  "src/opengrader/config.py",
  "src/opengrader/errors.py",
  "src/opengrader/grader.py",
  "src/opengrader/mvp4_contract.py",
  "src/opengrader/pdf_contract.py",
  "src/opengrader/pdf_grading.py",
  "src/opengrader/pdf_repository.py",
  "src/opengrader/pdf_service.py",
  "src/opengrader/repository.py",
  "src/opengrader/results.py",
  "src/opengrader/runners.py",
  "src/opengrader/submissions.py",
  "src/opengrader/stripe_gateway.py",
]
on_dependency_change = "rerun"
