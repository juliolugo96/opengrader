# Expected submission file: solution.js exporting sum and unique.
name: JavaScript module
image: node:22-alpine
setup: node --check solution.js
timeout_seconds: 5
memory_mb: 128
cpus: 1
pids_limit: 64
tests:
  - name: Module loads
    command: node -e 'require("./solution")'
    points: 1
  - name: Sum handles positive and negative values
    command: >-
      node -e 'const { sum } = require("./solution");
      if (sum([3, -1, 5]) !== 7) process.exit(1)'
    points: 4
  - name: Unique preserves first-seen order
    command: >-
      node -e 'const { unique } = require("./solution");
      const actual = JSON.stringify(unique([3, 1, 3, 2, 1]));
      if (actual !== "[3,1,2]") process.exit(1)'
    points: 5
